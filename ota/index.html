<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>macOS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ══════════ 开机画面 ══════════ -->
<div id="boot">
  <svg class="boot-apple" viewBox="0 0 384 512" width="72" height="96">
    <path fill="#fff" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
  </svg>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
</div>

<!-- ══════════ 锁屏 ══════════ -->
<div id="lock" class="hidden">
  <div class="lock-wall"></div>
  <div class="lock-content">
    <div class="lock-date" id="lockDate">10月3日 星期五</div>
    <div class="lock-time" id="lockTime">09:41</div>
  </div>
  <div class="lock-bottom">
    <div class="lock-avatar"><svg viewBox="0 0 64 64" width="100%" height="100%"><circle cx="32" cy="32" r="32" fill="#e8eaee"/><circle cx="32" cy="24" r="11" fill="#9aa0a8"/><path d="M10 57c3-13 12-18 22-18s19 5 22 18" fill="#9aa0a8"/></svg></div>
    <div class="lock-hint">点按任意处以解锁</div>
  </div>
</div>

<!-- ══════════ 登录 ══════════ -->
<div id="login" class="hidden">
  <div class="lock-wall blur"></div>
  <div class="login-box">
    <div class="login-avatar"><svg viewBox="0 0 64 64" width="100%" height="100%"><circle cx="32" cy="32" r="32" fill="#e8eaee"/><circle cx="32" cy="24" r="11" fill="#9aa0a8"/><path d="M10 57c3-13 12-18 22-18s19 5 22 18" fill="#9aa0a8"/></svg></div>
    <div class="login-name">User</div>
    <input id="loginPass" type="password" placeholder="输入密码" autocomplete="off">
    <div class="login-hint">演示模式 · 直接按回车即可登录</div>
  </div>
</div>

<!-- ══════════ 桌面 ══════════ -->
<div id="desktop" class="hidden">
  <!-- 虚拟舞台：逻辑分辨率，整体缩放适配任意屏幕 -->
  <div id="stage">
  <div id="wallpaper"></div>
  <div id="brightness"></div>

  <!-- 菜单栏 -->
  <div id="menubar">
    <div class="mb-left">
      <div class="mb-item mb-apple" data-menu="apple">
        <svg viewBox="0 0 384 512" width="15" height="17"><path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
      </div>
      <div class="mb-item mb-appname" id="mbAppName" data-menu="app">访达</div>
      <div class="mb-item" data-menu="file">文件</div>
      <div class="mb-item" data-menu="edit">编辑</div>
      <div class="mb-item" data-menu="view">显示</div>
      <div class="mb-item" data-menu="go">前往</div>
      <div class="mb-item" data-menu="window">窗口</div>
      <div class="mb-item" data-menu="help">帮助</div>
    </div>
    <div class="mb-right">
      <div class="mb-item mb-icon" id="mbBattery" data-menu="batt" title="电池">
        <svg viewBox="0 0 30 14" width="25" height="12"><rect x="0.5" y="0.5" width="24" height="13" rx="3.5" fill="none" stroke="currentColor" opacity="0.5"/><rect id="battLevel" x="2.5" y="2.5" width="14" height="9" rx="2" fill="currentColor"/><path d="M27 4.5v5a2.5 2.5 0 0 0 0-5z" fill="currentColor" opacity="0.5"/></svg>
      </div>
      <div class="mb-item mb-icon" id="mbWifi" data-menu="wifi" title="Wi-Fi">
        <svg viewBox="0 0 20 14" width="17" height="13"><path fill="currentColor" d="M10 12.2a1.8 1.8 0 1 1 0 .01zM10 8c-1.9 0-3.6.7-4.9 1.9l1.5 1.5A4.9 4.9 0 0 1 10 10c1.3 0 2.5.5 3.4 1.4l1.5-1.5A6.9 6.9 0 0 0 10 8zm0-4.2c-3 0-5.8 1.2-7.8 3.1l1.5 1.5A8.9 8.9 0 0 1 10 6.3c2.4 0 4.6 1 6.3 2.5l1.5-1.5A11 11 0 0 0 10 3.8zM10 0C5.9 0 2.2 1.6-.3 4.2l1.5 1.5A13 13 0 0 1 10 2.5c3.4 0 6.6 1.4 8.9 3.6l1.5-1.5A15.5 15.5 0 0 0 10 0z" transform="translate(1.2,-0.5) scale(0.9)"/></svg>
      </div>
      <div class="mb-item mb-icon" id="mbSiri" title="Siri">
        <img src="icons/siri.png" style="width:19px;height:19px;border-radius:5px" draggable="false">
      </div>
      <div class="mb-item mb-icon" id="mbSpotlight" title="聚焦搜索">
        <svg viewBox="0 0 20 20" width="15" height="15"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="13" y1="13" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div class="mb-item mb-icon" id="mbCC" title="控制中心">
        <svg viewBox="0 0 22 16" width="19" height="14"><rect x="0" y="1" width="22" height="6" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="4.8" cy="4" r="1.9" fill="currentColor"/><rect x="0" y="9" width="22" height="6" rx="3" fill="currentColor" opacity="0.35"/><circle cx="17.2" cy="12" r="1.9" fill="currentColor"/></svg>
      </div>
      <div class="mb-item mb-clock" id="mbClock">10月3日 周五 09:41</div>
    </div>
  </div>
  <div id="menuDrop" class="hidden"></div>

  <!-- 桌面图标 -->
  <div id="deskIcons"></div>

  <!-- 窗口层 -->
  <div id="windows"></div>

  <!-- 启动台 -->
  <div id="launchpad" class="hidden">
    <div class="lp-search"><input id="lpInput" placeholder="搜索"></div>
    <div class="lp-grid" id="lpGrid"></div>
  </div>

  <!-- 聚焦搜索 -->
  <div id="spotlight" class="hidden">
    <div class="sp-box">
      <svg viewBox="0 0 20 20" width="20" height="20" style="opacity:.6"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="13" y1="13" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="spInput" placeholder="Spotlight 搜索" autocomplete="off">
    </div>
    <div class="sp-results" id="spResults"></div>
  </div>

  <!-- 控制中心 -->
  <div id="controlCenter" class="hidden">
    <div class="cc-grid">
      <div class="cc-card cc-conn">
        <div class="cc-row" data-cc="wifi"><span class="cc-ico on" id="ccWifiIco"></span><div><div class="cc-t">无线局域网</div><div class="cc-s" id="ccWifiS">MyHome-5G</div></div></div>
        <div class="cc-row" data-cc="bt"><span class="cc-ico on" id="ccBtIco"></span><div><div class="cc-t">蓝牙</div><div class="cc-s" id="ccBtS">打开</div></div></div>
        <div class="cc-row" data-cc="airdrop"><span class="cc-ico" id="ccAdIco"></span><div><div class="cc-t">隔空投送</div><div class="cc-s">仅限联系人</div></div></div>
      </div>
      <div class="cc-card cc-dnd" id="ccFocus"><span class="cc-ico" id="ccFocusIco"></span><div><div class="cc-t">专注模式</div><div class="cc-s" id="ccFocusS">关闭</div></div></div>
      <div class="cc-card cc-stage" id="ccMC"><span class="cc-ico" id="ccMCIco"></span><div><div class="cc-t">调度中心</div></div></div>
      <div class="cc-card cc-mirror" id="ccMirror"><span class="cc-ico" id="ccMirrorIco"></span><div><div class="cc-t">屏幕镜像</div></div></div>
      <div class="cc-card cc-stage" id="ccPointer"><span class="cc-ico" id="ccPtrIco"></span><div><div class="cc-t">指针控制</div><div class="cc-s" id="ccPtrS">关闭</div></div></div>
      <div class="cc-card cc-wide">
        <div class="cc-t">显示器</div>
        <input type="range" id="ccBright" min="20" max="100" value="100">
        <div class="cc-s">亮度</div>
      </div>
      <div class="cc-card cc-wide">
        <div class="cc-t">声音</div>
        <input type="range" min="0" max="100" value="60">
        <div class="cc-s">音量</div>
      </div>
    </div>
  </div>

  <!-- 通知中心 -->
  <div id="notifCenter" class="hidden">
    <div class="nc-date" id="ncDate"></div>
    <div class="nc-widgets">
      <div class="nc-widget"><div class="nc-w-t">📅 日历</div><div class="nc-w-b" id="ncCal"></div></div>
      <div class="nc-widget"><div class="nc-w-t">🌤 天气</div><div class="nc-w-b"><div class="nc-temp">24°</div><div>杭州市 · 多云转晴</div><div class="nc-s">最高 27° 最低 18°</div></div></div>
      <div class="nc-widget"><div class="nc-w-t">🔋 电池</div><div class="nc-w-b" id="ncBatt">MacBook Air<br>100%</div></div>
      <div class="nc-widget"><div class="nc-w-t">✅ 提醒事项</div><div class="nc-w-b">· 买牛奶<br>· 给妈妈打电话<br>· 周五提交报告</div></div>
    </div>
    <div class="nc-list" id="ncList"></div>
  </div>

  <!-- Siri（真 AI：LongCat-2.0 + MiMo TTS） -->
  <div id="siri" class="hidden">
    <div class="siri-blob"></div>
    <div class="siri-text" id="siriText">我在听…</div>
    <div class="siri-sub" id="siriSub"></div>
    <input id="siriInput" class="siri-input" placeholder="问 Siri 点什么…" autocomplete="off">
  </div>

  <!-- 调度中心 -->
  <div id="missionControl" class="hidden"><div class="mc-grid" id="mcGrid"></div></div>

  <!-- Quick Look -->
  <div id="quicklook" class="hidden">
    <div class="ql-panel">
      <div class="ql-head"><span id="qlName"></span><span class="ql-close" id="qlClose">✕</span></div>
      <div class="ql-body" id="qlBody"></div>
    </div>
  </div>

  <!-- 截屏闪白 -->
  <div id="flash" class="hidden"></div>

  <!-- 虚拟鼠标指针（真·macOS 光标素材，纯视觉跟随） -->
  <div id="cursor" class="hidden"><img id="cursorImg" src="cursors/default.png" draggable="false"></div>

  <!-- App 切换器 -->
  <div id="appSwitcher" class="hidden"><div class="as-panel" id="asPanel"></div></div>

  <!-- 窗口分屏提示 -->
  <div id="tileHint" class="hidden"></div>

  <!-- 系统 OSD -->
  <div id="osd" class="hidden"><div class="osd-icon" id="osdIcon">☀️</div><div class="osd-meter" id="osdMeter"></div></div>

  <!-- 快速备忘录（热角） -->
  <div id="qnCorner"></div>
  <div id="quickNote" class="hidden"><textarea id="qnText" placeholder="快速备忘录…"></textarea></div>

  <!-- Emoji 选择器 -->
  <div id="emoji" class="hidden"><div class="ej-panel"><input id="ejSearch" placeholder="搜索表情符号"><div class="ej-grid" id="ejGrid"></div></div></div>

  <!-- 屏幕保护程序 -->
  <div id="screensaver" class="hidden"><canvas id="ssCanvas"></canvas><div class="ss-clock" id="ssClock"></div></div>

  <!-- 桌面小组件 -->
  <div id="widgets" class="hidden">
    <div class="wg-card"><div class="wg-t">🕰 时钟</div><div class="wg-big" id="wgClock">--:--</div></div>
    <div class="wg-card"><div class="wg-t">🌤 天气</div><div class="wg-big" id="wgWeather">--°</div><div id="wgCond" style="opacity:.7">定位中…</div></div>
    <div class="wg-card"><div class="wg-t">🔋 电池</div><div class="wg-big" id="wgBatt">--%</div></div>
  </div>

  <!-- Dock -->
  <div id="dockWrap">
    <div id="dock"></div>
  </div>

  <!-- 右键菜单 -->
  <div id="ctxMenu" class="hidden"></div>

  <!-- 通知横幅 -->
  <div id="banners"></div>
  </div><!-- /#stage -->
</div>

<script src="js/icons.js"></script>
<script src="js/apps.js"></script>
<script src="js/main.js"></script>
</body>
</html>
